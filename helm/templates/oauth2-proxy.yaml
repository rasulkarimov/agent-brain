# The console's sign-in: only this proxy reaches agentBrain's console port, and it sets the user headers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentbrain-oauth2-proxy
  labels: {app.kubernetes.io/name: agentbrain-oauth2-proxy, app.kubernetes.io/part-of: agentbrain}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: agentbrain-oauth2-proxy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agentbrain-oauth2-proxy, app.kubernetes.io/part-of: agentbrain}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: oauth2-proxy
          image: {{ .Values.oauth2Proxy.image }}
          args:
            - --provider=keycloak-oidc
            - --upstream=http://agentbrain:8791
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --reverse-proxy=true
            - --pass-user-headers=true
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --cookie-secure=true
            - --cookie-name=_agentbrain
            - --scope=openid profile email
            - --cookie-refresh=1m
          env:
            - {name: OAUTH2_PROXY_OIDC_ISSUER_URL, value: {{ .Values.oidc.issuerUrl | quote }}}
            - {name: OAUTH2_PROXY_REDIRECT_URL, value: "https://{{ .Values.hostname }}/oauth2/callback"}
            - {name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL, value: "true"}
            - {name: SSL_CERT_FILE, value: /etc/ca-bundle/ca.crt}
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: OAUTH2_PROXY_CLIENT_ID}}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: OAUTH2_PROXY_CLIENT_SECRET}}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: OAUTH2_PROXY_COOKIE_SECRET}}
          ports:
            - {name: http, containerPort: 4180}
          readinessProbe: {httpGet: {path: /ping, port: 4180}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /ping, port: 4180}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: ca-bundle, mountPath: /etc/ca-bundle, readOnly: true}
      volumes:
        - name: ca-bundle
          configMap: {name: {{ .Values.caBundleConfigMap }}}
---
apiVersion: v1
kind: Service
metadata:
  name: agentbrain-oauth2-proxy
  labels: {app.kubernetes.io/name: agentbrain-oauth2-proxy}
spec:
  selector: {app.kubernetes.io/name: agentbrain-oauth2-proxy}
  ports:
    - {name: http, port: 4180, targetPort: 4180}
