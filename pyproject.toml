[project]
name = "agentbrain"
version = "0.1.0"
description = "agentBrain: shared, governed memory for AI agents over MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.21",
    "asyncpg>=0.30",
    "uvicorn>=0.32",
    "pyjwt[crypto]>=2.10",
    "truststore>=0.10.5",
]

[project.scripts]
agentbrain = "agentbrain.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
